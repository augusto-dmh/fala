[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop", "apps/cli"]
default-members = ["crates/*", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Augusto Henriques"]
publish = false
# TODO(repo): add `repository` once the host is chosen.

[workspace.dependencies]
fala-core = { path = "crates/core" }
fala-hotkey = { path = "crates/hotkey" }
fala-audio = { path = "crates/audio" }
fala-asr = { path = "crates/asr" }
fala-postproc = { path = "crates/postproc" }
fala-inject = { path = "crates/inject" }
fala-storage = { path = "crates/storage" }
fala-meeting = { path = "crates/meeting" }
fala-retention = { path = "crates/retention" }
anyhow = "1"
audiopus_sys = { version = "0.2", features = ["static"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hound = "3.5"
ogg = "0.9"
opus = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1"
tempfile = "3"
thiserror = "2"

# Opted into by crates/* and apps/cli. apps/desktop (inherited upstream code) does not
# opt in yet; it moves to these lints as its logic migrates into crates/ in phase 1.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a cjpais/tao branch, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown (cjpais/Handy#1710). The pinned rev = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }

