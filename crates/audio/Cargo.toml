[package]
name = "fala-audio"
description = "Captura de áudio, VAD e resample."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
fala-core.workspace = true
# As mesmas versões e a mesma fonte git que o `apps/desktop` usa (ADR-0009).
cpal = "0.16.0"
rtrb = "0.4.0"
rubato = "0.16.2"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
log = "0.4"
thiserror.workspace = true
# O WAV de reunião (door 3 do plano `meeting-recorder`).
hound = "3.5.1"

[target.'cfg(windows)'.dependencies]
# O pico de cada saída (`OutputMeter`): a mesma versão que o `apps/desktop` usa.
windows = { version = "0.61.3", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[lints]
workspace = true
