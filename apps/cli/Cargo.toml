[package]
name = "fala-cli"
description = "Fala sem UI: spikes, benchmark e uso headless."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "fala-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
fala-core.workspace = true
fala-postproc.workspace = true
fala-secrets.workspace = true
fala-storage.workspace = true
# Código de spike da fase 0 (`bench`): os dois runtimes de ASR que o desktop já embarca.
# Migra para `crates/asr` na fase 1.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.3", default-features = false }
# Código de spike da fase 0 (`record`): captura dupla com o `cpal` que o desktop já usa.
# Migra para `crates/audio` na fase 2.
cpal = "0.16.0"
rtrb = "0.4.0"
hound = "3.5.1"
icu_normalizer = { version = "2.1.1", default-features = false, features = ["compiled_data"] }
log = "0.4.25"
env_logger = "0.10"

[features]
# GPU só por feature de build; o default é CPU.
vulkan = ["transcribe-cpp/vulkan"]
cuda = ["transcribe-cpp/cuda"]

[lints]
workspace = true
